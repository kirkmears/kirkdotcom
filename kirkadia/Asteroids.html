<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asteroids HTML5 Clone</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; display: block; }
  .wrap { text-align: center; }
  p { color: #888; font: 12px monospace; margin: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <p>&larr; &rarr; rotate &middot; &uarr; thrust &middot; SPACE fire &middot; ENTER start</p>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 800, H = 600;

let state = "menu";
let score = 0, hiScore = 0, lives = 3, level = 1;
let ship = null;
let asteroids = [], lasers = [], ufoBullets = [], explosions = [];
let ufo = { x: 0, y: 0, vx: 0, vy: 0, radius: 18, active: false };
let ufoTimer = 15, fireTimer = 0, timer = 0;
const keys = {};

let audio = null;
function beep(freq, dur = 0.1) {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.connect(g); g.connect(audio.destination);
    o.frequency.value = freq; g.gain.value = 0.07;
    o.start(); o.stop(audio.currentTime + dur);
  } catch (e) {}
}

// ---------- screen-wrapping boundary ("matrix rotation") ----------
function wrap(o) {
  if (o.x < 0) o.x += W; else if (o.x > W) o.x -= W;
  if (o.y < 0) o.y += H; else if (o.y > H) o.y -= H;
}

// ---------- circle collision ----------
function circleHit(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  const r = a.radius + b.radius;
  return dx * dx + dy * dy < r * r;
}

function radiusOf(size) { return size === 3 ? 40 : size === 2 ? 20 : 10; }
function speedOf(size) { return size === 3 ? 30 : size === 2 ? 50 : 80; }
function pointsOf(size) { return size === 3 ? 20 : size === 2 ? 50 : 100; }

function resetShip() {
  ship = {
    x: W / 2, y: H / 2, vx: 0, vy: 0,
    angle: -Math.PI / 2, radius: 14,
    rotSpeed: 4.5, thrustAccel: 180,
    thrusting: false, invuln: 2
  };
}

function spawnAsteroids() {
  asteroids = [];
  const n = 4 + level;
  for (let i = 0; i < n; i++) {
    let x, y;
    do {
      x = Math.random() * W; y = Math.random() * H;
    } while (Math.hypot(x - W / 2, y - H / 2) < 150);
    const angle = Math.random() * Math.PI * 2;
    asteroids.push({
      x: x, y: y,
      vx: Math.cos(angle) * speedOf(3), vy: Math.sin(angle) * speedOf(3),
      size: 3, radius: radiusOf(3),
      seed: Math.random() * 1000,
      angle: 0, spin: (Math.random() - 0.5) * 2
    });
  }
}

// ---------- splitting logic with random angle variations ----------
function splitAsteroid(a) {
  if (a.size > 1) {
    for (let i = 0; i < 2; i++) {
      const angle = Math.random() * Math.PI * 2;      // random angle variation
      const speed = speedOf(a.size - 1) + Math.random() * 30;
      asteroids.push({
        x: a.x, y: a.y,
        vx: Math.cos(angle) * speed + a.vx * 0.3,
        vy: Math.sin(angle) * speed + a.vy * 0.3,
        size: a.size - 1, radius: radiusOf(a.size - 1),
        seed: Math.random() * 1000,
        angle: 0, spin: (Math.random() - 0.5) * 2
      });
    }
  }
}

// ---------- vector momentum: thrust + inertia drift ----------
function updateShip(dt) {
  const s = ship;
  if (keys["ArrowLeft"]) s.angle -= s.rotSpeed * dt;
  if (keys["ArrowRight"]) s.angle += s.rotSpeed * dt;
  s.thrusting = !!keys["ArrowUp"];
  if (s.thrusting) {
    s.vx += Math.cos(s.angle) * s.thrustAccel * dt;
    s.vy += Math.sin(s.angle) * s.thrustAccel * dt;
  }
  s.x += s.vx * dt;          // inertia drift continues when thrust released
  s.y += s.vy * dt;
  wrap(s);
  if (s.invuln > 0) s.invuln -= dt;
  fireTimer -= dt;
  if (keys["Space"] && fireTimer <= 0 && lasers.length < 8) {
    fireTimer = 0.15;
    lasers.push({
      x: s.x + Math.cos(s.angle) * s.radius,
      y: s.y + Math.sin(s.angle) * s.radius,
      vx: s.vx + Math.cos(s.angle) * 400,
      vy: s.vy + Math.sin(s.angle) * 400,
      ttl: 1.0, radius: 2
    });
    beep(700, 0.05);
  }
}

function updateLasers(dt) {
  for (const l of lasers) {
    l.x += l.vx * dt; l.y += l.vy * dt;
    wrap(l);
    l.ttl -= dt;
  }
  lasers = lasers.filter(l => l.ttl > 0 && !l.dead);
}

function updateAsteroids(dt) {
  for (const a of asteroids) {
    a.x += a.vx * dt; a.y += a.vy * dt;
    wrap(a);
    a.angle += a.spin * dt;
  }
}

function spawnUFO() {
  const dir = Math.random() < 0.5 ? -1 : 1;
  ufo.x = dir === 1 ? -ufo.radius : W + ufo.radius;
  ufo.y = 60 + Math.random() * (H - 120);
  ufo.vx = dir * 120;
  ufo.vy = 0;
  ufo.active = true;
  ufo.shootTimer = 1.0;
}

function updateUFO(dt) {
  if (!ufo.active) return;
  ufo.x += ufo.vx * dt;
  ufo.y += ufo.vy * dt + Math.sin(performance.now() / 500) * 20 * dt;
  wrap(ufo);
  if (ufo.x < -ufo.radius - 60 || ufo.x > W + ufo.radius + 60) { ufo.active = false; return; }
  ufo.shootTimer -= dt;
  if (ufo.shootTimer <= 0) {
    ufo.shootTimer = 1.2;
    const dx = ship.x - ufo.x, dy = ship.y - ufo.y;
    const d = Math.hypot(dx, dy) || 1;
    ufoBullets.push({
      x: ufo.x, y: ufo.y,
      vx: dx / d * 220, vy: dy / d * 220,
      ttl: 2.0, radius: 2
    });
  }
}

function updateUFOBullets(dt) {
  for (const b of ufoBullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    wrap(b);
    b.ttl -= dt;
  }
  ufoBullets = ufoBullets.filter(b => b.ttl > 0 && !b.dead);
}

function updateExplosions(dt) {
  for (const e of explosions) e.ttl -= dt;
  explosions = explosions.filter(e => e.ttl > 0 && !e.dead);
}

function killShip() {
  if (ship.invuln > 0 || state !== "play") return;
  state = "dead"; timer = 1.6;
  explosions.push({ x: ship.x, y: ship.y, ttl: 0.6 });
  beep(80, 0.4);
}

function respawnShip() {
  resetShip();
  state = "play";
}

function runCollisions() {
  // lasers vs asteroids (splitting)
  for (const l of lasers) {
    for (const a of asteroids) {
      if (!a.dead && circleHit(l, a)) {
        a.dead = true; l.dead = true;
        score += pointsOf(a.size);
        explosions.push({ x: a.x, y: a.y, ttl: 0.5 });
        splitAsteroid(a);
        beep(150, 0.07);
      }
    }
  }
  lasers = lasers.filter(l => !l.dead);
  asteroids = asteroids.filter(a => !a.dead);

  // lasers vs UFO
  for (const l of lasers) {
    if (ufo.active && circleHit(l, ufo)) {
      ufo.active = false; l.dead = true;
      score += 200;
      explosions.push({ x: ufo.x, y: ufo.y, ttl: 0.5 });
    }
  }

  // ship vs asteroids / UFO / UFO bullets
  if (state === "play" && ship.invuln <= 0) {
    for (const a of asteroids) {
      if (circleHit(ship, a)) { killShip(); return; }
    }
    if (ufo.active && circleHit(ship, ufo)) { killShip(); return; }
    for (const b of ufoBullets) {
      if (circleHit(ship, b)) { b.dead = true; killShip(); return; }
    }
  }
}

function update(dt) {
  if (score > hiScore) hiScore = score;
  if (state === "play") {
    updateShip(dt);
    updateLasers(dt);
    updateAsteroids(dt);
    updateUFO(dt);
    updateUFOBullets(dt);
    updateExplosions(dt);
    runCollisions();
    ufoTimer -= dt;
    if (ufoTimer <= 0) { spawnUFO(); ufoTimer = 15 + Math.random() * 10; }
    if (!asteroids.length) { state = "levelup"; timer = 2; beep(300, 0.3); }
  } else if (state === "dead" || state === "levelup") {
    updateExplosions(dt);
    updateLasers(dt);
    updateAsteroids(dt);
    timer -= dt;
    if (timer <= 0) {
      if (state === "dead") {
        lives--;
        if (lives > 0) respawnShip();
        else state = "gameover";
      } else {
        level++;
        spawnAsteroids();
        respawnShip();
      }
    }
  }
}

// ---------- vector drawing ----------
function drawShip() {
  const s = ship;
  if (!s) return;
  if (s.invuln > 0 && Math.floor(performance.now() / 120) % 2) return; // blink
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle + Math.PI / 2);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -s.radius);
  ctx.lineTo(s.radius * 0.7, s.radius);
  ctx.lineTo(0, s.radius * 0.4);
  ctx.lineTo(-s.radius * 0.7, s.radius);
  ctx.closePath(); ctx.stroke();
  if (s.thrusting) {
    ctx.strokeStyle = "#f80";
    ctx.beginPath();
    ctx.moveTo(-s.radius * 0.3, s.radius + 2);
    ctx.lineTo(0, s.radius + 10);
    ctx.lineTo(s.radius * 0.3, s.radius + 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.angle);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  ctx.beginPath();
  const n = 10;
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2;
    const r = a.radius * (0.75 + 0.25 * Math.sin(a.seed + i * 2.7));
    const px = Math.cos(ang) * r, py = Math.sin(ang) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function drawLasers() {
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  for (const l of lasers) {
    ctx.beginPath();
    ctx.moveTo(l.x, l.y);
    ctx.lineTo(l.x - l.vx * 0.02, l.y - l.vy * 0.02);
    ctx.stroke();
  }
}

function drawUFO() {
  if (!ufo.active) return;
  ctx.fillStyle = "#f7f";
  ctx.beginPath();
  ctx.ellipse(ufo.x, ufo.y + 6, ufo.radius, ufo.radius / 2 - 2, 0, 0, 7);
  ctx.fill();
  ctx.fillStyle = "#7cf";
  ctx.beginPath(); ctx.arc(ufo.x, ufo.y, 8, Math.PI, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
  for (const b of ufoBullets) {
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02);
    ctx.stroke();
  }
}

function drawExplosions() {
  for (const e of explosions) {
    const r = Math.max(1, (0.6 - e.ttl) * 60);
    ctx.strokeStyle = "#ff0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, 7); ctx.stroke();
  }
}

function drawHUD() {
  ctx.fillStyle = "#fff"; ctx.font = "16px monospace";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + score, 10, 20);
  ctx.fillText("LEVEL " + level, 10, 40);
  ctx.textAlign = "right";
  ctx.fillText("HI " + hiScore, W - 10, 20);
  ctx.fillText("LIVES " + lives, W - 10, 40);
}

function overlayText(lines, color, size, dy) {
  ctx.fillStyle = color; ctx.font = size + "px monospace"; ctx.textAlign = "center";
  lines.forEach((s, i) => ctx.fillText(s, W / 2, dy + i * (size + 10)));
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const a of asteroids) drawAsteroid(a);
  drawUFO();
  drawLasers();
  drawShip();
  drawExplosions();
  drawHUD();

  if (state === "menu") {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H);
    overlayText(["ASTEROIDS"], "#fff", 48, 200);
    overlayText(["HTML5 CLONE"], "#7cf", 20, 260);
    overlayText(["Rotate, thrust, and shoot the asteroids!", "Press ENTER to start"], "#fff", 16, 340);
  }
  if (state === "dead") overlayText(["OUCH!"], "#f7f", 32, 300);
  if (state === "levelup") overlayText(["LEVEL " + level + " CLEARED!"], "#7cf", 28, 300);
  if (state === "gameover") {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H);
    overlayText(["GAME OVER", "Press ENTER"], "#f7f", 32, 300);
  }
}

addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code))
    e.preventDefault();
  keys[e.code] = true;
  if (e.code === "Enter") {
    if (state === "menu") {
      score = 0; lives = 3; level = 1;
      resetShip(); spawnAsteroids();
      lasers = []; ufoBullets = []; explosions = [];
      ufo.active = false; ufoTimer = 15;
      state = "play";
    } else if (state === "gameover") state = "menu";
  }
});
addEventListener("keyup", e => keys[e.code] = false);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resetShip();
spawnAsteroids();
requestAnimationFrame(loop);
</script>
</body>
</html>
